# Creates the v2.3 tag only after all three native package jobs pass on main.
# Pushing the tag starts the Downloader workflow's GitHub Pre-release job.
name: Tag passing desktop release

on:
  workflow_run:
    workflows: ["Downloader"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create the annotated release tag once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: Blueknightv2.3
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Release tag $TAG_NAME already exists; leaving it unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Blue Knight Downloader v2.3"
          git push origin "refs/tags/$TAG_NAME"

          # GITHUB_TOKEN pushes do not start push-triggered workflows. Dispatch
          # the release workflow explicitly against the just-created tag.
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/downloader.yml/dispatches" \
            -d "{\"ref\":\"$TAG_NAME\"}"
