# Blue Knight Downloader — Linux Lite, Linux Full and Windows Full releases.
#
# Every desktop package is built on its native runner. Lite and Full share the
# same application; Lite downloads bulky native engines only when required.
name: Downloader

on:
  push:
    branches: [blue-knight-net, main, "refactor/**"]
    tags: ["downloader-v*", "Blueknightv*"]
    paths: ["**", "!README.md"]
  pull_request:
    paths: ["**", "!README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Path and platform checks
        run: |
          python blueknight_paths.py
          python pyshell.py

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, flavor: lite }
          - { os: ubuntu-24.04, target: linux-x64, flavor: full }
          - { os: windows-2022, target: windows-x64, flavor: full }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # Full builds include the .NET and JVM fallback engines. Lite skips both.
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install WebKitGTK
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-webkit2-4.1 \
            libcairo2-dev libgirepository1.0-dev pkg-config
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Linux package
        if: startsWith(matrix.os, 'ubuntu')
        run: bash ./build_portable.sh --flavor "${{ matrix.flavor }}"

      - name: Smoke test Linux package
        if: startsWith(matrix.os, 'ubuntu')
        env:
          BLUEKNIGHT_EXPECT_FLAVOR: ${{ matrix.flavor }}
        run: ./release/BlueKnightDownloader --self-test

      - name: Build Windows package
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: .\build_portable.ps1

      - name: Smoke test Windows package
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          BLUEKNIGHT_EXPECT_FLAVOR: ${{ matrix.flavor }}
        run: .\release\BlueKnightDownloader.exe --self-test

      - uses: actions/upload-artifact@v6
        with:
          name: blueknight-${{ matrix.target }}-${{ matrix.flavor }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    needs: [desktop]
    if: (startsWith(github.ref, 'refs/tags/downloader-v') || startsWith(github.ref, 'refs/tags/Blueknightv'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
          prerelease: true
          make_latest: false
