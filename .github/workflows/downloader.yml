# Blue Knight Downloader — Linux-first desktop package. Windows CI is paused.
#
# PyInstaller packages are built on their native runners. Linux is the only
# active CI target right now; the Windows packaging script remains available.
#
# The repository at the root holds a second, unrelated app (White Booster) with
# its own release.yml on the "v*" tags. This one answers to "downloader-v*" so
# the two never fire on each other's releases.
name: Downloader

on:
  push:
    branches: [blue-knight-net, main, "refactor/**"]
    # Two names for the same thing: this repository tags its releases
    # "Blueknightv2.1"; the monorepo it is synced from uses "downloader-v*".
    tags: ["downloader-v*", "Blueknightv*"]
    paths: ["**", "!README.md"]
  pull_request:
    paths: ["**", "!README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The engine's own checks, once, before the platform runners package it.
  # --------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Path and platform checks

        run: |
          python blueknight_paths.py
          python pyshell.py

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # The desktop's second YouTube engine is a .NET sidecar. The build
      # scripts skip it when no SDK is present, so without this the packages
      # would still build and quietly ship one engine short.
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }

      # The NewPipe engine is a JVM library, so the desktop carries a helper
      # and a runtime trimmed with jlink. Without a JDK the build skips it and
      # would ship one engine short without saying so.
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }

      - name: Install Python dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pywebview draws through WebKitGTK on Linux and fails at import without
      # it. The Windows packaging script is retained, but its CI job is paused.
      # Install the Python dependencies first: after PYTHONPATH is exported,
      # pip would otherwise see Ubuntu's protected system copy of itself.
      - name: Install WebKitGTK
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-webkit2-4.1 \
            libcairo2-dev libgirepository1.0-dev pkg-config
          # setup-python is installed under /opt and does not automatically
          # see Ubuntu's ABI-compatible python3-gi package. Expose that package
          # both to the build-time probe and to PyInstaller's import analysis.
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: Build (Linux)
        if: startsWith(matrix.os, 'ubuntu')

        run: bash ./build_portable.sh

      # A binary that cannot start is not a build. Run the frozen executable,
      # not the source interpreter, so missing PyInstaller data is caught.
      - name: Smoke test the Linux package
        if: startsWith(matrix.os, 'ubuntu')

        run: ./release/BlueKnightDownloader --self-test

      - uses: actions/upload-artifact@v6
        with:
          name: blueknight-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    needs: [desktop]
    if: (startsWith(github.ref, 'refs/tags/downloader-v') || startsWith(github.ref, 'refs/tags/Blueknightv'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
