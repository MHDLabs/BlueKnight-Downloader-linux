name: Live demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_live_demo.py"
      - "tests/check_live_demo.py"
      - "contracts/desktop-bridge-v1.json"
      - ".github/workflows/live-demo.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_live_demo.py"
      - "tests/check_live_demo.py"
      - "contracts/desktop-bridge-v1.json"
      - ".github/workflows/live-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build browser demo
        run: python scripts/build_live_demo.py --source web --output _site

      - name: Validate frontend assets
        run: python tests/check_web_assets.py

      - name: Validate demo adapter and generated site
        run: python tests/check_live_demo.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
