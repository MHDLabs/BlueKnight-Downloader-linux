name: Web frontend checks

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "tests/**"
      - "contracts/**"
      - "spotify_downloader.py"
      - "blueknight/**"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "web/**"
      - "tests/**"
      - "contracts/**"
      - ".github/workflows/web-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Validate frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check HTML asset references
        run: python tests/check_web_assets.py

      - name: Check JavaScript syntax and shared bindings
        run: node tests/check_web_scripts.mjs

      - name: Check Python and frontend bridge contract
        run: python tests/check_bridge_contract.py

      - name: Test proxy URL handling and SOCKS5 bridge
        run: python -m unittest discover -s tests -p "test_*.py" -v
